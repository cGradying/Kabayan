services:
  - type: web
    name: kabayan-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kabayan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: kabayan-db
    plan: free
    postgresMajorVersion: 16
